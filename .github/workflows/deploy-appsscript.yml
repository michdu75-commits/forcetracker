name: "Essai P1 — Apps Script de TEST (⛔ NE DÉPLOIE PAS LA PRODUCTION)"
# ⛔ CE FICHIER NE VIT QUE SUR LA BRANCHE `test/p1-apps-script-2026-11-04` (même nom de fichier que le workflow de production, pour pouvoir être lancé
#    à la main depuis cette branche : GitHub n'autorise `workflow_dispatch` que pour un fichier déjà présent sur master). ⛔ NE JAMAIS LE FUSIONNER.
#    Il pousse le Code.js du CANDIDAT dans un projet Apps Script de TEST (Script ID donné à la main, jamais celui de la production), SANS la Sheet de production,
#    crée un déploiement web de TEST, puis joue les scénarios P1 par HTTP (comptes fictifs @example.invalid seulement).
#    BROUILLON NON EXÉCUTÉ : écrit d'après le workflow de production (mêmes commandes clasp 3.3.0) ; ses gardes et son découpage sont éprouvés en local, pas sa conversation avec Google.
on:
  workflow_dispatch:
    inputs:
      etape:
        description: 'deployer (pousse + crée le déploiement de TEST) | diag (lecture seule : ce que Google répond) | c1 (vrai client A/A2 contre le TEST) | c5 (suspension/reprise) | essais (scénarios P1) | suspension (scénario P1-09, après avoir posé NUT_SUSPENDU) | sonde (sonde du verrou, ZÉRO donnée écrite : adresse de TEST ou, par défaut, de la production APRÈS son déploiement) | ecrasement (P0 : témoins des séances écrasées, par HTTP, comptes fictifs, TEST seulement) | verdict (P0 : lecture seule du verdict de la recette et des dossiers) | recette (P0 : tente de lancer la recette R1-R10 par l API Apps Script, TEST seulement ; Google peut refuser)'
        required: true
        default: 'deployer'
      script_id:
        description: '(deployer seulement) Script ID du projet de TEST (⛔ jamais celui de la production)'
        required: false
        default: ''
      url_exec:
        description: '(essais / suspension / sonde) adresse /exec ; pour la sonde, vide = la production'
        required: false
        default: ''

jobs:
  p1:
    runs-on: ubuntu-24.04   # figé : « ubuntu-latest » est passé en 26.04, que Playwright 1.56.1 ne sait pas installer (constaté le 06/11/2026, run 152)
    timeout-minutes: 120
    steps:
      - name: "Récupérer le code"
        uses: actions/checkout@v4

      - name: "Gardes — jamais sur master, jamais sur le projet de production"
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          ETAPE: ${{ inputs.etape }}
        run: |
          set -euo pipefail
          echo "=== ESSAI P1 — workflow D'ESSAI (ce n'est PAS le workflow de production) · ref ${GITHUB_REF} · étape ${ETAPE} ==="
          [ "${GITHUB_REF}" != "refs/heads/master" ] || { echo "::error::refus : ce workflow d'essai ne tourne pas sur master"; exit 1; }
          case "$ETAPE" in deployer|pousser|essais|suspension|sonde|diag|diag2|verifier|isolement|echo|webkit|ping-prod|deploiements|c1|c1seul|c5|ecrasement|verdict|recette) ;; *) echo "::error::etape inconnue : $ETAPE"; exit 1;; esac
          if [ "$ETAPE" = "deployer" ] || [ "$ETAPE" = "pousser" ]; then
            # (le .clasp.json de CETTE branche pointe lui-même vers le projet de TEST — ceinture : si GitHub exécutait par erreur le workflow de PRODUCTION sur cette branche, il pousserait dans le projet de TEST et échouerait au redéploiement)
            [ -n "$SCRIPT_ID" ] || { echo "::error::script_id vide"; exit 1; }
            [ "$SCRIPT_ID" != "1RwE46heNmZrykInYcrMgm1OZWt4NmS6NjTqttvAevZLuqo2v6EEb1Drw" ] || { echo "::error::REFUS : Script ID de production"; exit 1; }
            printf '%s' "$SCRIPT_ID" | grep -qE '^1[A-Za-z0-9_-]{40,60}$' || { echo "::error::script_id : format inattendu"; exit 1; }
            echo "✅ gardes passées : ${GITHUB_REF} · Script ID de test ≠ production"
          else
            echo "✅ gardes passées : ${GITHUB_REF} · étape ${ETAPE} (aucune poussée de code, aucun secret clasp utilisé)"
          fi

      - name: "Installer Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Préparer le dossier poussé (Code.js du candidat, Sheet de production NEUTRALISÉE, + TestP1.js)"
        if: ${{ inputs.etape == 'deployer' || inputs.etape == 'pousser' }}
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
        run: |
          set -euo pipefail
          mkdir stage
          cp Code.js appsscript.json stage/
          cp p1/TestP1.js stage/TestP1.js
          sed -i "s/^var SHEET_ID_ = '[^']*';/var SHEET_ID_ = 'TEST-SANS-FEUILLE-DE-PRODUCTION';/" stage/Code.js
          test "$(grep -c "^var SHEET_ID_ = 'TEST-SANS-FEUILLE-DE-PRODUCTION';" stage/Code.js)" = "1"
          test "$(grep -c "1b0kuCk6kuNi26hMJq5Q5R6-mKFeXEexfm2P9SryJ-eg" stage/Code.js)" = "0"
          # le code poussé ne diffère du candidat QUE par cette ligne (une ligne retirée, une ajoutée) :
          test "$(diff Code.js stage/Code.js | grep -c '^[<>]')" = "2"
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > stage/.clasp.json
          # même forme que le .claspignore de production (tout ignoré, sauf une liste) : seuls ces trois fichiers partent dans le projet de TEST
          printf '**/**\n!Code.js\n!appsscript.json\n!TestP1.js\n' > stage/.claspignore
          ls -la stage
          echo "✅ dossier prêt : Code.js (1 ligne neutralisée) + appsscript.json + TestP1.js"

      - name: "Installer clasp"
        if: ${{ inputs.etape == 'deployer' || inputs.etape == 'pousser' }}
        run: npm install -g @google/clasp@3.3.0

      - name: "Restaurer l'authentification clasp (depuis le secret)"
        if: ${{ inputs.etape == 'deployer' || inputs.etape == 'pousser' }}
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: "Pousser dans le projet de TEST"
        if: ${{ inputs.etape == 'deployer' || inputs.etape == 'pousser' }}
        working-directory: stage
        run: |
          set -euo pipefail
          clasp push --force

      - name: "Créer le déploiement web de TEST (NOUVEAU déploiement : aucun identifiant de production)"
        if: ${{ inputs.etape == 'deployer' }}
        working-directory: stage
        run: |
          set -euo pipefail
          SORTIE=$(clasp create-deployment -d "P1 TEST ${GITHUB_SHA::8}" 2>&1 | tee /dev/stderr)
          ID=$(echo "$SORTIE" | grep -oE 'AKfyc[0-9A-Za-z_-]{20,}' | head -1 || true)
          [ -n "$ID" ] || { echo "::error::identifiant de déploiement introuvable dans la sortie de clasp"; exit 1; }
          [ "$ID" != "AKfycbxWUsEFIlmx-Jxh9jWmEkvXl6rYXk5pR__u5i_GhnOtXua_f6W8wPNqCztZNDMD9N4qbA" ] || { echo "::error::REFUS : déploiement de production"; exit 1; }
          echo "::notice::ADRESSE DE TEST : https://script.google.com/macros/s/${ID}/exec"
          echo "ADRESSE_EXEC=https://script.google.com/macros/s/${ID}/exec" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "→ Ouvrir le projet de TEST dans l'éditeur, lancer UNE FOIS la fonction preparerEssaiP1 et accepter les autorisations ; puis relancer ce workflow avec etape=essais et url_exec=<l'adresse ci-dessus>."

      - name: "Scénarios P1 (par HTTP, comptes fictifs @example.invalid seulement)"
        if: ${{ inputs.etape == 'essais' || inputs.etape == 'suspension' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
          ETAPE: ${{ inputs.etape }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          if [ "$ETAPE" = "suspension" ]; then node p1/p1_scenarios.js "$URL_EXEC" --suspendu --rapport p1/rapport_suspension.json; else node p1/p1_scenarios.js "$URL_EXEC" --rapport p1/rapport.json; fi

      # SONDE DU VERROU — ZÉRO donnée écrite : un seul POST « pushHealth » vers une adresse FICTIVE sans compte (voir p1/sonde_verrou.js). Ne lit ni n'utilise CLASPRC_JSON.
      # Vide = l'adresse /exec de la PRODUCTION (la même que celle de .github/workflows/deploy-appsscript.yml) ; à lancer APRÈS le déploiement du candidat, jamais avant (l'ancien Code.js ne prend aucun verrou).
      - name: "Sonde du verrou (rien n'est écrit)"
        if: ${{ inputs.etape == 'sonde' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || URL_EXEC="https://script.google.com/macros/s/AKfycbxWUsEFIlmx-Jxh9jWmEkvXl6rYXk5pR__u5i_GhnOtXua_f6W8wPNqCztZNDMD9N4qbA/exec"
          node p1/sonde_verrou.js "$URL_EXEC"

      - name: "Diagnostic de l'adresse (lecture seule : un GET test=1, rien n'est écrit)"
        if: ${{ inputs.etape == 'diag' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          node p1/diag_url.js "$URL_EXEC"

      - name: "Ping de LECTURE SEULE de la production (un GET test=1, aucune écriture) — sert à savoir si Google répond aux serveurs GitHub"
        if: ${{ inputs.etape == 'ping-prod' }}
        run: node p1/diag_url.js "https://script.google.com/macros/s/AKfycbxWUsEFIlmx-Jxh9jWmEkvXl6rYXk5pR__u5i_GhnOtXua_f6W8wPNqCztZNDMD9N4qbA/exec" --ping-prod-lecture-seule

      - name: "Inspecter les déploiements du projet de TEST (lecture seule : API Apps Script, aucun secret affiché)"
        if: ${{ inputs.etape == 'deploiements' }}
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [ "$SCRIPT_ID" != "1RwE46heNmZrykInYcrMgm1OZWt4NmS6NjTqttvAevZLuqo2v6EEb1Drw" ] || { echo "::error::REFUS : Script ID de production"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node p1/inspecter_deploiements.js "$SCRIPT_ID"

      - name: "Diagnostic AVANCÉ du projet de TEST (lecture seule : fichier Drive, quota, chaîne de redirections de chaque déploiement ; aucun secret ni adresse affichés)"
        if: ${{ inputs.etape == 'diag2' }}
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [ "$SCRIPT_ID" != "1RwE46heNmZrykInYcrMgm1OZWt4NmS6NjTqttvAevZLuqo2v6EEb1Drw" ] || { echo "::error::REFUS : Script ID de production"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node p1/diag_avance.js "$SCRIPT_ID"

      - name: "Vérifier un déploiement de TEST et son isolement (lecture seule : API Apps Script + un GET test=1 ; aucun secret ni adresse affichés)"
        if: ${{ inputs.etape == 'verifier' }}
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          URL_EXEC: ${{ inputs.url_exec }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [ "$SCRIPT_ID" != "1RwE46heNmZrykInYcrMgm1OZWt4NmS6NjTqttvAevZLuqo2v6EEb1Drw" ] || { echo "::error::REFUS : Script ID de production"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node p1/verifier_deploiement.js "$SCRIPT_ID" "$URL_EXEC"

      - name: "Preuve d'isolement par le comportement (TEST seulement : fait déborder la zone de récupération d'un compte fictif, compte ce que contiennent les dossiers Drive)"
        if: ${{ inputs.etape == 'isolement' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node p1/prouver_isolement.js "$URL_EXEC"

      - name: "Durée de vie de l'adresse de réponse de Google (lecture seule : des GET test=1, rien n'est écrit)"
        if: ${{ inputs.etape == 'echo' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          node p1/sonde_echo.js "$URL_EXEC"

      - name: "Même chemin que l'app dans le moteur WebKit (Safari) : POST text/plain + 302, réponse lisible ? (TEST seulement, compte fictif)"
        if: ${{ inputs.etape == 'webkit' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
          node p1/sonde_webkit.js "$URL_EXEC"

      - name: "Installer Playwright + Chromium (essais navigateur C1 / C5)"
        if: ${{ inputs.etape == 'c1' || inputs.etape == 'c5' || inputs.etape == 'c1seul' }}
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: "C1 — le VRAI client A/A2 contre le VRAI projet de TEST (comptes fictifs @example.invalid)"
        if: ${{ inputs.etape == 'c1' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          node p1/c1_reel.js "$URL_EXEC" --rapport p1/rapport_c1.json

      - name: "C1 seul (scénarios nommés dans script_id, ex. R3 ou R1,R3) avec le détail des requêtes — projet de TEST uniquement"
        if: ${{ inputs.etape == 'c1seul' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
          LISTE: ${{ inputs.script_id }}
          FT_C1_DEBUG: '1'
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          printf '%s' "$LISTE" | grep -qE '^R[0-9]b?(,R[0-9]b?)*$' || { echo "::error::liste de scénarios invalide : $LISTE"; exit 1; }
          node p1/c1_reel.js "$URL_EXEC" --only "$LISTE" --rapport p1/rapport_c1seul.json

      - name: "C5 — suspension puis reprise sur le projet de TEST (le vrai client ET le serveur)"
        if: ${{ inputs.etape == 'c5' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          node p1/c1_reel.js "$URL_EXEC" --c5 --rapport p1/rapport_c5.json

      # P0 SAUVEGARDES (11/11/2026, « GO TEST P0 » de Michel) — les cas d'écrasement des séances, par HTTP, comptes FICTIFS seulement ; refuse l'adresse de la production (rien d'autre n'est touché : ni propriété, ni dossier, ni déclencheur).
      - name: "Témoins d'écrasement des séances P0 (par HTTP, comptes fictifs @example.invalid seulement)"
        if: ${{ inputs.etape == 'ecrasement' }}
        env:
          URL_EXEC: ${{ inputs.url_exec }}
        run: |
          set -euo pipefail
          [ -n "$URL_EXEC" ] || { echo "::error::url_exec vide"; exit 1; }
          case "$URL_EXEC" in *AKfycbxWUsEFIlmx*) echo "::error::REFUS : adresse de production"; exit 1;; esac
          node p1/p0_ecrasement.js "$URL_EXEC" --rapport p1/rapport_p0.json

      # P0 SAUVEGARDES — LECTURE SEULE du verdict de la recette (nom du marqueur « P0-VERDICT-PASS|FAIL-… » dans le dossier de TEST) et des nombres du dossier de production (à comparer à « verifier » d'avant). Aucun nom de compte affiché.
      - name: "Lire le verdict de la recette P0 et l'état des dossiers (LECTURE SEULE : API Apps Script + API Drive ; noms de fichiers de sauvegarde et nombres, jamais un compte)"
        if: ${{ inputs.etape == 'verdict' }}
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [ "$SCRIPT_ID" != "1RwE46hNmZrykInYcrMgm1OZWt4NmS6NjTqttvAevZLuqo2v6EEb1Drw" ] || { echo "::error::REFUS : Script ID de production"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node p1/lire_verdict_p0.js "$SCRIPT_ID"

      # P0 SAUVEGARDES — règle d'or n°16 : MESURER si la recette R1–R10 peut se lancer sans clic de Michel (API `scripts.run`, TEST seulement, la même fonction que l'éditeur). Si Google refuse, l'erreur exacte est la preuve ; rien n'est écrit dans ce cas.
      - name: "Tenter de lancer la recette P0 par l'API Apps Script (TEST seulement ; Google peut refuser : l'erreur exacte est alors la preuve que le clic est nécessaire)"
        if: ${{ inputs.etape == 'recette' }}
        env:
          SCRIPT_ID: ${{ inputs.script_id }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [ "$SCRIPT_ID" != "1RwE46hNmZrykInYcrMgm1OZWt4NmS6NjTqttvAevZLuqo2v6EEb1Drw" ] || { echo "::error::REFUS : Script ID de production"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node p1/lancer_recette_p0.js "$SCRIPT_ID"

      - name: "Garder le rapport"
        if: ${{ always() && (inputs.etape == 'essais' || inputs.etape == 'suspension' || inputs.etape == 'c1' || inputs.etape == 'c5' || inputs.etape == 'c1seul' || inputs.etape == 'ecrasement') }}
        uses: actions/upload-artifact@v4
        with:
          name: "rapport-p1"
          path: p1/rapport*.json
          if-no-files-found: ignore
