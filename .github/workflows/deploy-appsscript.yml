name: Déployer le backend (Apps Script)

# Se déclenche automatiquement dès que Code.js (ou appsscript.json) change sur master,
# et peut aussi être lancé à la main depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [master]
    paths:
      - 'Code.js'
      - 'appsscript.json'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Restaurer l'authentification clasp (depuis le secret)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Pousser Code.js (respecte .claspignore = seulement Code.js + appsscript.json)
        run: clasp push --force

      - name: Redéployer la web app (déploiement existant — clasp v3 create-deployment, repli sur deploy)
        run: |
          ID=AKfycbxWUsEFIlmx-Jxh9jWmEkvXl6rYXk5pR__u5i_GhnOtXua_f6W8wPNqCztZNDMD9N4qbA
          clasp create-deployment -i "$ID" -d "Auto-deploy GitHub" || clasp deploy -i "$ID" -d "Auto-deploy GitHub"

      # ⚠️ CETTE ÉTAPE NE VÉRIFIAIT RIEN (constaté le 04/08/2026, run @124).
      # Deux défauts qui se cumulaient :
      #   ① `curl -s` sans -L ne SUIT PAS la redirection — or Apps Script redirige toujours vers
      #      googleusercontent.com. Le journal affichait « Moved Temporarily », jamais la réponse.
      #   ② `|| true` : l'étape ne pouvait pas échouer, donc le feu vert ne prouvait rien.
      # C'est la famille « un contrôle qui ne peut pas échouer ne contrôle rien » (BUGS.md §12),
      # et ça vide la règle R18 de son sens : on vérifiait le push, pas le déploiement.
      - name: Vérifier que le backend répond VRAIMENT
        run: |
          sleep 5
          REP=$(curl -sSL --max-time 30 "https://script.google.com/macros/s/AKfycbxWUsEFIlmx-Jxh9jWmEkvXl6rYXk5pR__u5i_GhnOtXua_f6W8wPNqCztZNDMD9N4qbA/exec?test=1")
          echo "Réponse du backend : $REP"
          echo "$REP" | grep -q '"status":"online"' || {
            echo "::error::Le backend ne répond PAS « online » après déploiement — l'app est peut-être cassée pour tout le monde."
            exit 1
          }
          echo "✅ Backend en ligne."

      # Contrôle ciblé du correctif du 04/08 : authStatus en mode light doit répondre sans
      # charger le compte. Sur une adresse inexistante, la réponse doit rester structurée.
      - name: Vérifier authStatus (mode light)
        run: |
          # ⚠️ PAS de -X POST ici : avec -X, curl REJOUE la requête en POST sur l'adresse de
          # redirection de Google (qui n'accepte que des GET) → « unable to open the file ».
          # Sans -X, `--data` suffit à faire un POST, et curl bascule en GET après la redirection.
          # Piège vécu le 04/08 : le run a échoué en désignant le backend, alors que le backend
          # allait bien — c'était le contrôle qui était faux.
          REP=$(curl -sSL --max-time 30 \
            -H "Content-Type: text/plain;charset=utf-8" \
            --data '{"action":"authStatus","email":"controle-deploiement@exemple.invalid","light":true}' \
            "https://script.google.com/macros/s/AKfycbxWUsEFIlmx-Jxh9jWmEkvXl6rYXk5pR__u5i_GhnOtXua_f6W8wPNqCztZNDMD9N4qbA/exec")
          echo "Réponse authStatus : $REP"
          echo "$REP" | grep -q '"hasCode"' || {
            echo "::error::authStatus ne répond pas comme attendu."
            exit 1
          }
          echo "✅ authStatus répond."
